name: Build ROM - Test6

on:
  workflow_dispatch:
    inputs:
      rom_manifest:
        description: ROM manifest URL
        default: https://github.com/LineageOS/android.git
        required: true
        type: string

      rom_manifest_branch:
        description: ROM manifest branch
        default: lineage-17.1
        required: true
        type: string

      device:
        description: Device codename
        required: true
        type: string

      build_type:
        description: Build variant
        required: true
        default: userdebug
        type: choice
        options:
          - user
          - userdebug
          - eng

      manifest_url:
        description: Local manifest XML direct URL
        required: true
        type: string

      upload_repository:
        description: owner/repository to upload the release to
        required: true
        type: string

      zip_pattern:
        description: ROM ZIP filename pattern
        default: "lineage-*.zip"
        required: true
        type: string

      custom_env:
        description: Custom environment variables to export befroe build (e.g., VAR1=value1 VAR2=value2)
        required: false
        default: ""
        type: string

      custom_commands:
        description: Custom bash commands to run before build (chain with && or ;)
        required: false
        default: ""
        type: string

      build_command:
        description: ROM build command
        required: false
        default: 'source build/envsetup.sh && breakfast "$DEVICE" "$BUILD_TYPE" && brunch "$DEVICE"'
        type: string

      set_custom_build_identity:
        description: Set custom BUILD_USERNAME and BUILD_HOSTNAME
        required: false
        default: false
        type: boolean

      SWAP_SIZE:
        description: Swap size (GB)
        required: true
        default: 16
        type: number

      ROM_SIZE:
        description: ROM image max size (GB)
        required: false
        default: 105
        type: number

      handoff_seconds:
        description: Seconds before handing off the build to a new runner
        required: false
        default: 17400
        type: number

      use_external_storage:
        description: REQUIRED - use the STORAGE runner for prebuilts and self-hosted BuildBarn RBE
        required: false
        default: true
        type: boolean

      role:
        description: DO NOT TOUCH - Internal workflow role
        required: false
        default: main
        type: choice
        options:
          - main
          - builder
          - out
          - storage

      parent_run_id:
        description: DO NOT TOUCH - Parent workflow run ID
        required: false
        default: ""
        type: string

      parent_tailscale_ip:
        description: DO NOT TOUCH - Parent runner Tailscale IP
        required: false
        default: ""
        type: string

      old_out_ip:
        description: DO NOT TOUCH - Tailscale IP of the previous OUT runner
        required: false
        default: ""
        type: string

      old_storage_ip:
        description: DO NOT TOUCH - Tailscale IP of the previous STORAGE runner
        required: false
        default: ""
        type: string

      handoff_id:
        description: DO NOT TOUCH - Unique handoff identifier
        required: false
        default: ""
        type: string

env:
  TZ: UTC
  SSHPASS: ${{ secrets.userpassword }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Run cleanup
        uses: justinthelaw/maximize-github-runner-space@main

      - name: Run second cleanup
        uses: rokibhasansagar/slimhub_actions@main

      - name: Swap Space
        uses: pierotofy/set-swap-space@master
        if: inputs.role == 'main' || inputs.role == 'builder'
        with:
          swap-size-gb: ${{ inputs.SWAP_SIZE }}

      - name: Install ROM build dependencies
        if: inputs.role == 'main' || inputs.role == 'builder'
        run: |
          sudo apt update
          sudo apt upgrade -y
          sudo apt install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            erofs-utils \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            protobuf-compiler \
            python3-protobuf \
            lib32readline-dev \
            lib32z1-dev \
            libdw-dev \
            libelf-dev \
            libgnutls28-dev \
            lz4 \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            schedtool \
            squashfs-tools \
            xsltproc \
            xxd \
            zip \
            zlib1g-dev

          wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libtinfo5_6.3-2_amd64.deb
          sudo dpkg -i libtinfo5_6.3-2_amd64.deb
          rm -f libtinfo5_6.3-2_amd64.deb

          wget https://archive.ubuntu.com/ubuntu/pool/universe/n/ncurses/libncurses5_6.3-2_amd64.deb
          sudo dpkg -i libncurses5_6.3-2_amd64.deb
          rm -f libncurses5_6.3-2_amd64.deb

          # Build Python 2.7 from source
          cd /tmp
          wget https://www.python.org/ftp/python/2.7.18/Python-2.7.18.tgz
          tar xzf Python-2.7.18.tgz
          cd Python-2.7.18
          
          ./configure --prefix=/usr/local/python2.7
          make -j$(nproc)
          sudo make install
          
          # Symlink to python2
          sudo ln -sf /usr/local/python2.7/bin/python2.7 /usr/bin/python2
          python2 --version
          
      - name: Install handoff dependencies
        if: inputs.role == 'main' || inputs.role == 'builder' || inputs.role == 'out' || inputs.role == 'storage'
        run: |
          sudo apt update
          sudo apt install -y \
            nbd-client \
            nbd-server \
            openssh-server \
            gh \
            rsync \
            sshpass \
            docker.io \
            netcat-openbsd

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Get Tailscale IP
        id: tailscale_ip
        shell: bash
        run: |
          set -e

          TS_IP=$(tailscale ip -4)

          if [[ -z "$TS_IP" ]]; then
            echo "ERROR: Could not determine Tailscale IPv4."
            exit 1
          fi

          echo "Tailscale IPv4: $TS_IP"
          echo "ip=$TS_IP" >> "$GITHUB_OUTPUT"

      - name: Require STORAGE for RBE
        if: inputs.role == 'main' || inputs.role == 'builder' || inputs.role == 'out' || inputs.role == 'storage'
        shell: bash
        run: |
          set -e
          if [[ "${{ inputs.use_external_storage }}" != "true" ]]; then
            echo "ERROR: this workflow now requires use_external_storage=true because STORAGE hosts the BuildBarn RBE frontend, CAS, scheduler, and a worker."
            exit 1
          fi

      - name: Configure Git
        if: inputs.role == 'main' || inputs.role == 'builder'
        run: |
          if [ "${{ github.actor }}" = "TheGamerKing561" ]; then
            git config --global user.name "TheGamerKing"
            git config --global user.email "eyadtamer2121@gmail.com"
          else
            git config --global user.name "${{ github.actor }}"
            git config --global user.email "${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com"
          fi
          git config --global trailer.changeid.key "Change-Id"

      - name: Configure Git LFS
        if: inputs.role == 'main' || inputs.role == 'builder'
        run: git lfs install

      - name: Authenticate GitHub CLI
        env:
          GH_AUTH_TOKEN: ${{ secrets.GH_AUTH_TOKEN }}
        run: |
          echo "$GH_AUTH_TOKEN" | gh auth login --with-token
          gh auth setup-git

      - name: Start Background SSH & Tunnel
        id: tunnel
        shell: bash
        run: |
          set -e

          sudo service ssh start

          echo "runner:${{ secrets.userpassword }}" | sudo chpasswd

          wget -q \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -O cloudflared.deb

          sudo dpkg -i cloudflared.deb
          rm -f cloudflared.deb

          cloudflared tunnel \
            --url ssh://localhost:22 \
            > cloudflare.log 2>&1 &

          echo "$!" > "$GITHUB_WORKSPACE/cloudflared.pid"

          sleep 15

          echo "=== SSH CONNECTION DETAILS ==="
          cat cloudflare.log
          echo "=============================="

          TUNNEL_HOST=$(grep -oE 'https://[^ ]+\.trycloudflare\.com' cloudflare.log \
            | head -n1 \
            | sed 's#https://##')

          if [[ -z "$TUNNEL_HOST" ]]; then
            echo "ERROR: Could not find Cloudflare tunnel hostname."
            cat cloudflare.log
            exit 1
          fi

          echo "Cloudflare hostname: $TUNNEL_HOST"

          echo "tunnel_host=$TUNNEL_HOST" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "BACKGROUND SSH AND TUNNEL READY"
          echo "=========================================="
          echo "Role: ${{ inputs.role }}"
          echo "Cloudflare hostname: $TUNNEL_HOST"
          echo "=========================================="

      - name: Install repo tool
        if: inputs.role == 'main'
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Create and mount ROM image
        if: inputs.role == 'main'
        shell: bash
        run: |
          set -e

          ROM_ROOT="/storage/android-rom"
          ROM_IMG="$ROM_ROOT/rom.img"
          ROM_MOUNT="$ROM_ROOT/rom"

          echo "=========================================="
          echo "CREATING ROM IMAGE"
          echo "=========================================="

          sudo mkdir -p "$ROM_ROOT"

          sudo chown runner:runner "$ROM_ROOT"

          # ROM source sparse image
          sudo truncate -s "${{ inputs.ROM_SIZE }}G" "$ROM_IMG"

          echo "Formatting ext4 filesystem..."
          sudo mkfs.ext4 -F \
            -m 0 \
            "$ROM_IMG"

          sudo chown runner:runner "$ROM_IMG"

          sudo mkdir -p "$ROM_MOUNT"

          sudo mount \
            -o loop \
            "$ROM_IMG" \
            "$ROM_MOUNT"

          sudo chown runner:runner "$ROM_MOUNT"

          echo
          echo "ROM image:"
          ls -lh "$ROM_IMG"

          echo
          echo "ROM filesystem:"
          df -h "$ROM_MOUNT"

          echo
          echo "Actual image disk usage:"
          sudo du -h "$ROM_IMG"

          echo
          echo "ROM mount:"
          mount | grep "$ROM_MOUNT"

          echo "=========================================="
          echo "ROM IMAGE READY"
          echo "=========================================="

      - name: Initialize source
        if: inputs.role == 'main'
        run: |
          set -e

          ROM_DIR="/storage/android-rom/rom"

          cd "$ROM_DIR"

          repo init \
            -u "${{ inputs.rom_manifest }}" \
            -b "${{ inputs.rom_manifest_branch }}" \
            --git-lfs \
            --depth=1

      - name: Download local manifest
        if: inputs.role == 'main'
        run: |
          set -e

          ROM_DIR="/storage/android-rom/rom"

          cd "$ROM_DIR"

          mkdir -p .repo/local_manifests

          curl -L "${{ inputs.manifest_url }}" \
            -o .repo/local_manifests/extra.xml

      - name: Start initial OUT runner
        if: inputs.role == 'main'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING INITIAL OUT RUNNER"
          echo "=========================================="

          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f rom_manifest="${{ inputs.rom_manifest }}" \
            -f rom_manifest_branch="${{ inputs.rom_manifest_branch }}" \
            -f device="${{ inputs.device }}" \
            -f build_type="${{ inputs.build_type }}" \
            -f manifest_url="${{ inputs.manifest_url }}" \
            -f upload_repository="${{ inputs.upload_repository }}" \
            -f zip_pattern="${{ inputs.zip_pattern }}" \
            -f custom_env="${{ inputs.custom_env }}" \
            -f custom_commands="${{ inputs.custom_commands }}" \
            -f set_custom_build_identity="${{ inputs.set_custom_build_identity }}" \
            -f SWAP_SIZE="8" \
            -f handoff_seconds="${{ inputs.handoff_seconds }}" \
            -f use_external_storage="${{ inputs.use_external_storage }}" \
            -f role=out \
            -f parent_run_id="${{ github.run_id }}" \
            -f parent_tailscale_ip="${{ steps.tailscale_ip.outputs.ip }}"

          echo "Initial OUT workflow dispatched."

      - name: Start initial STORAGE runner
        if: inputs.role == 'main' && inputs.use_external_storage
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STARTING INITIAL STORAGE RUNNER"
          echo "=========================================="

          gh workflow run "${{ github.workflow }}" \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f rom_manifest="${{ inputs.rom_manifest }}" \
            -f rom_manifest_branch="${{ inputs.rom_manifest_branch }}" \
            -f device="${{ inputs.device }}" \
            -f build_type="${{ inputs.build_type }}" \
            -f manifest_url="${{ inputs.manifest_url }}" \
            -f upload_repository="${{ inputs.upload_repository }}" \
            -f zip_pattern="${{ inputs.zip_pattern }}" \
            -f custom_env="${{ inputs.custom_env }}" \
            -f custom_commands="${{ inputs.custom_commands }}" \
            -f set_custom_build_identity="${{ inputs.set_custom_build_identity }}" \
            -f SWAP_SIZE="8" \
            -f ROM_SIZE="${{ inputs.ROM_SIZE }}" \
            -f handoff_seconds="${{ inputs.handoff_seconds }}" \
            -f use_external_storage="${{ inputs.use_external_storage }}" \
            -f role=storage \
            -f parent_run_id="${{ github.run_id }}" \
            -f parent_tailscale_ip="${{ steps.tailscale_ip.outputs.ip }}"

          echo "Initial STORAGE workflow dispatched."

      - name: Connect to STORAGE before sync
        if: inputs.role == 'main' && inputs.use_external_storage
        shell: bash
        run: |
          set -e

          IP_FILE="$GITHUB_WORKSPACE/storage_runner_ip"
          RUN_ID_FILE="$GITHUB_WORKSPACE/storage_runner_run_id"

          echo "=========================================="
          echo "WAITING FOR STORAGE RUNNER"
          echo "=========================================="

          for i in {1..720}; do
            if [[ -s "$IP_FILE" && -s "$RUN_ID_FILE" ]]; then
              break
            fi

            echo "Waiting for STORAGE runner... ($i/720)"
            sleep 5
          done

          if [[ ! -s "$IP_FILE" ]]; then
            echo "ERROR: STORAGE runner IP was not received."
            exit 1
          fi

          if [[ ! -s "$RUN_ID_FILE" ]]; then
            echo "ERROR: STORAGE runner workflow ID was not received."
            exit 1
          fi

          STORAGE_IP=$(cat "$IP_FILE" | tr -d '[:space:]')
          STORAGE_RUN_ID=$(cat "$RUN_ID_FILE" | tr -d '[:space:]')

          echo "STORAGE runner IP: $STORAGE_IP"
          echo "STORAGE workflow ID: $STORAGE_RUN_ID"

          sudo modprobe nbd max_part=8
          sudo mkdir -p /storage/android-rom/rom/prebuilts

          CONNECTED=false
          for i in {1..120}; do
            if sudo nbd-client \
              "$STORAGE_IP" \
              10809 \
              /dev/nbd3 \
              -N android-storage; then
              CONNECTED=true
              break
            fi

            echo "STORAGE NBD server not ready yet... ($i/120)"
            sudo nbd-client -d /dev/nbd3 2>/dev/null || true
            sleep 5
          done

          if [[ "$CONNECTED" != "true" ]]; then
            echo "ERROR: Could not connect to STORAGE NBD server."
            exit 1
          fi

          sudo mount \
            /dev/nbd3 \
            /storage/android-rom/rom/prebuilts

          sudo chown runner:runner /storage/android-rom/rom/prebuilts

          echo "=========================================="
          echo "STORAGE CONNECTED BEFORE SYNC"
          echo "=========================================="

          df -h /storage/android-rom/rom/prebuilts

      - name: Sync sources
        if: inputs.role == 'main'
        shell: bash
        run: |
          cd /storage/android-rom/rom

          # Always show disk usage, even if this step exits with an error.
          cleanup() {
            echo ""
            echo "=== ROM SUBDIRECTORY SIZES ==="
            du -sh /storage/android-rom/rom/*/ 2>/dev/null | sort -h || true

            echo ""
            echo "=== TOTAL ROM DIRECTORY SIZE ==="
            du -sh /storage/android-rom/rom || true

            echo ""
            echo "=== FILESYSTEM USAGE ==="
            df -h || true
          }

          trap cleanup EXIT

          cat << 'EOF' > run_sync.sh
          #!/bin/bash

          echo "=== STARTING REPO SYNC ==="

          repo sync \
            -c \
            -j"$(nproc --all)" \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune

          sync_exit=$?

          if [ $sync_exit -ne 0 ]; then
            echo "Repo sync failed with exit code $sync_exit."
            exit $sync_exit
          fi
          EOF

          chmod +x run_sync.sh

          screen -dmS android-sync \
            bash -c './run_sync.sh 2>&1 | tee sync.log; echo ${PIPESTATUS[0]} > sync.exit'

          echo "Repo sync started in screen session. Streaming logs..."

          while [[ ! -f sync.log ]]; do
            sleep 1
          done

          tail -f sync.log &
          TAIL_PID=$!

          while screen -list | grep -q "android-sync"; do
            sleep 10
          done

          kill "$TAIL_PID" 2>/dev/null || true

          if [[ ! -f sync.exit ]]; then
            echo "Sync exit status file not found."
            exit 1
          fi

          STATUS=$(cat sync.exit)

          if [[ "$STATUS" != "0" ]]; then
            echo "=== FINAL SYNC ERROR LOGS (Last 100 lines) ==="
            tail -n 100 sync.log
            echo "============================================="
            exit "$STATUS"
          fi

          echo "Repo sync completed successfully!"

      - name: Setup STORAGE server
        if: inputs.role == 'storage'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "STORAGE RUNNER"
          echo "=========================================="

          sudo mkdir -p /storage/android-storage
          sudo chown -R runner:runner /storage/android-storage
          sudo chmod 755 /storage/android-storage

          STORAGE_IMG=/storage/android-storage/storage.img

          if [[ -n "${{ inputs.old_storage_ip }}" ]]; then
            echo "=========================================="
            echo "REPLACEMENT STORAGE RUNNER"
            echo "=========================================="

            OLD_STORAGE_IP="${{ inputs.old_storage_ip }}"
            echo "Old STORAGE runner: $OLD_STORAGE_IP"

            sudo modprobe nbd max_part=8

            sudo nbd-client \
              "$OLD_STORAGE_IP" \
              10809 \
              /dev/nbd3 \
              -N android-storage

            sudo truncate -s 125G "$STORAGE_IMG"
            sudo dd \
              if=/dev/nbd3 \
              of="$STORAGE_IMG" \
              bs=16M \
              status=progress \
              conv=sparse

            sudo nbd-client -d /dev/nbd3
          else
            echo "=========================================="
            echo "INITIAL STORAGE RUNNER"
            echo "=========================================="

            sudo truncate -s 125G "$STORAGE_IMG"
            sudo mkfs.ext4 -F -m 0 "$STORAGE_IMG"
          fi

          sudo chown runner:runner "$STORAGE_IMG"

          # ----------------------------------------------------------
          # STORAGE NBD server
          # ----------------------------------------------------------
          sudo modprobe nbd max_part=8
          sudo mkdir -p /etc/nbd-server

          sudo tee /etc/nbd-server/config >/dev/null <<EOF
          [generic]
              user = runner
              group = runner
              listenaddr = 0.0.0.0

          [android-storage]
              exportname = $STORAGE_IMG
              flush = true
              trim = true
          EOF

          sudo pkill nbd-server 2>/dev/null || true
          sudo nbd-server -C /etc/nbd-server/config
          sleep 3

          # ----------------------------------------------------------
          # BuildBarn RBE server
          # ----------------------------------------------------------
          sudo systemctl start docker || true
          docker info >/dev/null

          RBE_ROOT=/storage/android-rbe
          BB_CONFIG="$RBE_ROOT/config"
          BB_WORKER="$RBE_ROOT/worker"
          BB_RUNNER="$RBE_ROOT/bb"
          BB_CAS="$RBE_ROOT/storage-cas"
          BB_AC="$RBE_ROOT/storage-ac"

          mkdir -p "$BB_CONFIG" "$BB_WORKER/build" "$BB_WORKER/cache" "$BB_RUNNER" "$BB_CAS" "$BB_AC"
          chmod 0777 "$BB_WORKER/build" "$BB_WORKER/cache"

          BB_STORAGE_IMAGE='ghcr.io/buildbarn/bb-storage:20260609T094425Z-10acc76'
          BB_SCHEDULER_IMAGE='ghcr.io/buildbarn/bb-scheduler:20260527T162223Z-c48dcda'
          BB_WORKER_IMAGE='ghcr.io/buildbarn/bb-worker:20260527T162223Z-c48dcda'
          BB_RUNNER_INSTALLER='ghcr.io/buildbarn/bb-runner-installer:20260527T162223Z-c48dcda'
          RBE_CONTAINER_IMAGE='gcr.io/androidbuild-re-dockerimage/android-build-remoteexec-image@sha256:582efb38f0c229ea39952fff9e132ccbe183e14869b39888010dacf56b360d62'

          docker pull "$BB_STORAGE_IMAGE"
          docker pull "$BB_SCHEDULER_IMAGE"
          docker pull "$BB_WORKER_IMAGE"
          docker pull "$BB_RUNNER_INSTALLER"
          docker pull "$RBE_CONTAINER_IMAGE"

          cat > "$BB_CONFIG/common.libsonnet" <<EOF
          {
            blobstore: {
              contentAddressableStorage: { grpc: { client: { address: '127.0.0.1:8981' } } },
              actionCache: { grpc: { client: { address: '127.0.0.1:8981' } } },
            },
            browserUrl: 'http://127.0.0.1:7984',
            maximumMessageSizeBytes: 2 * 1024 * 1024,
            global: {},
          }
          EOF

          cat > "$BB_CONFIG/storage.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            grpcServers: [{ listenAddresses: [':8981'], authenticationPolicy: { allow: {} }, }],
            maximumMessageSizeBytes: common.maximumMessageSizeBytes,
            global: common.global,
            contentAddressableStorage: {
              backend: {
                'local': {
                  keyLocationMapOnBlockDevice: { file: { path: '/storage-cas/key_location_map', sizeBytes: 512 * 1024 * 1024, }, },
                  keyLocationMapMaximumGetAttempts: 16,
                  keyLocationMapMaximumPutAttempts: 64,
                  oldBlocks: 8,
                  currentBlocks: 24,
                  newBlocks: 3,
                  blocksOnBlockDevice: {
                    source: { file: { path: '/storage-cas/blocks', sizeBytes: 32 * 1024 * 1024 * 1024, }, },
                    spareBlocks: 3,
                  },
                  persistent: { stateDirectoryPath: '/storage-cas/persistent_state', minimumEpochInterval: '300s', },
                },
              },
              getAuthorizer: { allow: {} },
              putAuthorizer: { allow: {} },
              findMissingAuthorizer: { allow: {} },
            },
            actionCache: {
              backend: {
                'local': {
                  keyLocationMapOnBlockDevice: { file: { path: '/storage-ac/key_location_map', sizeBytes: 16 * 1024 * 1024, }, },
                  keyLocationMapMaximumGetAttempts: 16,
                  keyLocationMapMaximumPutAttempts: 64,
                  oldBlocks: 8,
                  currentBlocks: 24,
                  newBlocks: 1,
                  blocksOnBlockDevice: {
                    source: { file: { path: '/storage-ac/blocks', sizeBytes: 128 * 1024 * 1024, }, },
                    spareBlocks: 3,
                  },
                  persistent: { stateDirectoryPath: '/storage-ac/persistent_state', minimumEpochInterval: '300s', },
                },
              },
              getAuthorizer: { allow: {} },
              putAuthorizer: { allow: {} },
            },
          }
          EOF

          cat > "$BB_CONFIG/scheduler.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            adminHttpServers: [{ listenAddresses: [':7982'], authenticationPolicy: { allow: {} }, }],
            clientGrpcServers: [{ listenAddresses: [':8982'], authenticationPolicy: { allow: {} }, }],
            workerGrpcServers: [{ listenAddresses: [':8983'], authenticationPolicy: { allow: {} }, }],
            buildQueueStateGrpcServers: [{ listenAddresses: [':8984'], authenticationPolicy: { allow: {} }, }],
            browserUrl: common.browserUrl,
            contentAddressableStorage: common.blobstore.contentAddressableStorage,
            maximumMessageSizeBytes: common.maximumMessageSizeBytes,
            global: common.global,
            executeAuthorizer: { allow: {} },
            modifyDrainsAuthorizer: { allow: {} },
            killOperationsAuthorizer: { allow: {} },
            synchronizeAuthorizer: { allow: {} },
            actionRouter: {
              simple: {
                platformKeyExtractor: { action: {} },
                invocationKeyExtractors: [ { correlatedInvocationsId: {} }, { toolInvocationId: {} }, ],
                initialSizeClassAnalyzer: { defaultExecutionTimeout: '1800s', maximumExecutionTimeout: '7200s', },
              },
            },
            platformQueueWithNoWorkersTimeout: '900s',
          }
          EOF

          cat > "$BB_CONFIG/frontend.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            grpcServers: [{ listenAddresses: [':8980'], authenticationPolicy: { allow: {} }, }],
            schedulers: {
              '': { endpoint: { address: '127.0.0.1:8982', addMetadataJmespathExpression: { expression: ||| { \"build.bazel.remote.execution.v2.requestmetadata-bin\": incomingGRPCMetadata.\"build.bazel.remote.execution.v2.requestmetadata-bin\" } |||, }, }, },
            },
            maximumMessageSizeBytes: common.maximumMessageSizeBytes,
            global: common.global,
            contentAddressableStorage: { backend: common.blobstore.contentAddressableStorage, getAuthorizer: { allow: {} }, putAuthorizer: { allow: {} }, findMissingAuthorizer: { allow: {} }, },
            actionCache: { backend: common.blobstore.actionCache, getAuthorizer: { allow: {} }, putAuthorizer: { allow: {} }, },
            executeAuthorizer: { allow: {} },
          }
          EOF

          cat > "$BB_CONFIG/worker.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            blobstore: common.blobstore,
            browserUrl: common.browserUrl,
            maximumMessageSizeBytes: common.maximumMessageSizeBytes,
            scheduler: { address: '127.0.0.1:8983' },
            global: common.global,
            buildDirectories: [{
              native: {
                buildDirectoryPath: '/worker/build',
                cacheDirectoryPath: '/worker/cache',
                maximumCacheFileCount: 10000,
                maximumCacheSizeBytes: 4 * 1024 * 1024 * 1024,
                cacheReplacementPolicy: 'LEAST_RECENTLY_USED',
              },
              runners: [{
                endpoint: { address: 'unix:///worker/runner' },
                concurrency: 8,
                instanceNamePrefix: 'android',
                platform: {
                  properties: [
                    { name: 'Pool', value: 'default' },
                    { name: 'OSFamily', value: 'linux' },
                    { name: 'container-image', value: 'docker://gcr.io/androidbuild-re-dockerimage/android-build-remoteexec-image@sha256:582efb38f0c229ea39952fff9e132ccbe183e14869b39888010dacf56b360d62' },
                  ],
                },
                workerId: { datacenter: 'github', rack: 'storage', slot: '${{ github.run_id }}', hostname: 'storage-${{ github.run_id }}' },
              }],
            }],
            inputDownloadConcurrency: 10,
            outputUploadConcurrency: 11,
            directoryCache: { maximumCount: 1000, maximumSizeBytes: 1000 * 1024, cacheReplacementPolicy: 'LEAST_RECENTLY_USED' },
          }
          EOF

          cat > "$BB_CONFIG/runner.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            buildDirectoryPath: '/worker/build',
            global: common.global,
            grpcServers: [{ listenPaths: ['/worker/runner'], authenticationPolicy: { allow: {} }, }],
          }
          EOF

          docker run --rm \
            --network host \
            -v "$BB_RUNNER:/bb" \
            "$BB_RUNNER_INSTALLER"

          docker rm -f bb-runner bb-worker bb-frontend bb-scheduler bb-storage 2>/dev/null || true

          docker run -d --name bb-storage \
            --network host \
            -v "$BB_CONFIG:/config:ro" \
            -v "$BB_CAS:/storage-cas" \
            -v "$BB_AC:/storage-ac" \
            "$BB_STORAGE_IMAGE" /config/storage.jsonnet

          docker run -d --name bb-scheduler \
            --network host \
            -v "$BB_CONFIG:/config:ro" \
            "$BB_SCHEDULER_IMAGE" /config/scheduler.jsonnet

          docker run -d --name bb-frontend \
            --network host \
            -v "$BB_CONFIG:/config:ro" \
            "$BB_STORAGE_IMAGE" /config/frontend.jsonnet

          docker run -d --name bb-runner \
            --network none \
            -v "$BB_RUNNER:/bb" \
            -v "$BB_CONFIG:/config:ro" \
            -v "$BB_WORKER:/worker" \
            "$RBE_CONTAINER_IMAGE" \
            sh -c 'while ! test -f /bb/installed; do sleep 1; done; exec /bb/bb_runner /config/runner.jsonnet'

          docker run -d --name bb-worker \
            --network host \
            -v "$BB_CONFIG:/config:ro" \
            -v "$BB_WORKER:/worker" \
            "$BB_WORKER_IMAGE" /config/worker.jsonnet

          for port in 8980 8981 8982 8983; do
            for i in {1..60}; do
              if nc -z 127.0.0.1 "$port" 2>/dev/null; then
                break
              fi
              sleep 1
            done
          done

          docker ps --format 'table {{.Names}}\t{{.Status}}' | grep -E 'bb-(storage|scheduler|frontend|worker|runner)' || true

          TS_IP=$(tailscale ip -4)
          PARENT_TS_IP="${{ inputs.parent_tailscale_ip }}"

          if [[ -z "$TS_IP" || -z "$PARENT_TS_IP" ]]; then
            echo "ERROR: missing Tailscale IP."
            exit 1
          fi

          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            runner@"$PARENT_TS_IP" \
            "printf '%s\n' '$TS_IP' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/storage_runner_ip && printf '%s\n' '${{ github.run_id }}' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/storage_runner_run_id"

          echo "STORAGE RBE service: $TS_IP:8980"
          echo "STORAGE NBD export: android-storage on :10809"

          while true; do
            PARENT_STATUS=$(
              gh run view \
                "${{ inputs.parent_run_id }}" \
                --repo "${{ github.repository }}" \
                --json status \
                --jq '.status' \
                2>/dev/null || true
            )

            echo "Parent workflow status: ${PARENT_STATUS:-unknown}"

            case "$PARENT_STATUS" in
              completed|cancelled|failure|timed_out)
                echo "Stopping STORAGE services."
                sudo sync || true
                docker rm -f bb-runner bb-worker bb-frontend bb-scheduler bb-storage 2>/dev/null || true
                sudo pkill nbd-server || true
                exit 0
                ;;
            esac

            sleep 30
          done

      - name: Setup OUT storage server
        if: inputs.role == 'out'
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "OUT RUNNER"
          echo "=========================================="

          sudo mkdir -p /storage/android-out
          sudo chown -R runner:runner /storage/android-out
          sudo chmod 755 /storage/android-out

          OUT_IMG=/storage/android-out/out.img

          if [[ -n "${{ inputs.old_out_ip }}" ]]; then
            echo "=========================================="
            echo "REPLACEMENT OUT RUNNER"
            echo "=========================================="

            echo "Old OUT runner:"
            echo "${{ inputs.old_out_ip }}"

            echo "=========================================="
            echo "DOWNLOADING OLD OUT IMAGE VIA NBD"
            echo "=========================================="
            
            sudo modprobe nbd max_part=8

            sudo nbd-client \
              "${{ inputs.old_out_ip }}" \
              10809 \
              /dev/nbd1 \
              -N android-out

            echo "Copying OUT image..."

            sudo truncate -s 125G "$OUT_IMG"

            sudo dd \
              if=/dev/nbd1 \
              of="$OUT_IMG" \
              bs=16M \
              status=progress \
              conv=sparse

            echo "Disconnecting old OUT..."

            sudo nbd-client \
              -d \
              /dev/nbd1

          else
            echo "=========================================="
            echo "INITIAL OUT RUNNER"
            echo "=========================================="

            sudo truncate -s 125G "$OUT_IMG"
            sudo mkfs.ext4 -F "$OUT_IMG"

          fi

          sudo chown runner:runner "$OUT_IMG"

          echo "=========================================="
          echo "OUT IMAGE"
          echo "=========================================="

          ls -lh "$OUT_IMG"
          sudo du -h "$OUT_IMG"
          sudo du --apparent-size -h "$OUT_IMG"
          sudo file "$OUT_IMG"

          sudo modprobe nbd max_part=8

          sudo mkdir -p /etc/nbd-server

          sudo tee /etc/nbd-server/config >/dev/null <<EOF
          [generic]
              user = runner
              group = runner
              listenaddr = 0.0.0.0

          [android-out]
              exportname = $OUT_IMG
              flush = true
              trim = true
          EOF

          sudo cat /etc/nbd-server/config

          sudo pkill nbd-server 2>/dev/null || true

          sudo nbd-server \
            -C /etc/nbd-server/config

          sleep 3

          echo "=========================================="
          echo "WAITING FOR STORAGE RBE"
          echo "=========================================="

          PARENT_TS_IP="${{ inputs.parent_tailscale_ip }}"
          RBE_STORAGE_IP=""

          for i in {1..720}; do
            RBE_STORAGE_IP=$(
              sshpass -e ssh \
                -p 22 \
                -o StrictHostKeyChecking=no \
                -o UserKnownHostsFile=/dev/null \
                -o ConnectTimeout=10 \
                runner@"$PARENT_TS_IP" \
                "cat /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/storage_runner_ip" \
                2>/dev/null || true
            )
            RBE_STORAGE_IP=$(echo "$RBE_STORAGE_IP" | tr -d '[:space:]')
            if [[ -n "$RBE_STORAGE_IP" ]]; then
              break
            fi
            sleep 5
          done

          if [[ -z "$RBE_STORAGE_IP" ]]; then
            echo "ERROR: STORAGE RBE IP was not received."
            exit 1
          fi

          sudo systemctl start docker || true
          docker info >/dev/null

          RBE_ROOT=/storage/android-rbe
          BB_CONFIG="$RBE_ROOT/config"
          BB_WORKER="$RBE_ROOT/worker"
          BB_RUNNER="$RBE_ROOT/bb"
          mkdir -p "$BB_CONFIG" "$BB_WORKER/build" "$BB_WORKER/cache" "$BB_RUNNER"
          chmod 0777 "$BB_WORKER/build" "$BB_WORKER/cache"

          BB_WORKER_IMAGE='ghcr.io/buildbarn/bb-worker:20260527T162223Z-c48dcda'
          BB_RUNNER_INSTALLER='ghcr.io/buildbarn/bb-runner-installer:20260527T162223Z-c48dcda'
          RBE_CONTAINER_IMAGE='gcr.io/androidbuild-re-dockerimage/android-build-remoteexec-image@sha256:582efb38f0c229ea39952fff9e132ccbe183e14869b39888010dacf56b360d62'

          docker pull "$BB_WORKER_IMAGE"
          docker pull "$BB_RUNNER_INSTALLER"
          docker pull "$RBE_CONTAINER_IMAGE"

          cat > "$BB_CONFIG/common.libsonnet" <<EOF
          {
            blobstore: {
              contentAddressableStorage: { grpc: { client: { address: '$RBE_STORAGE_IP:8981' } } },
              actionCache: { grpc: { client: { address: '$RBE_STORAGE_IP:8981' } } },
            },
            browserUrl: 'http://$RBE_STORAGE_IP:8980',
            maximumMessageSizeBytes: 2 * 1024 * 1024,
            global: {},
          }
          EOF

          cat > "$BB_CONFIG/worker.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            blobstore: common.blobstore,
            browserUrl: common.browserUrl,
            maximumMessageSizeBytes: common.maximumMessageSizeBytes,
            scheduler: { address: '$RBE_STORAGE_IP:8983' },
            global: common.global,
            buildDirectories: [{
              native: {
                buildDirectoryPath: '/worker/build',
                cacheDirectoryPath: '/worker/cache',
                maximumCacheFileCount: 10000,
                maximumCacheSizeBytes: 4 * 1024 * 1024 * 1024,
                cacheReplacementPolicy: 'LEAST_RECENTLY_USED',
              },
              runners: [{
                endpoint: { address: 'unix:///worker/runner' },
                concurrency: 8,
                instanceNamePrefix: 'android',
                platform: {
                  properties: [
                    { name: 'Pool', value: 'default' },
                    { name: 'OSFamily', value: 'linux' },
                    { name: 'container-image', value: 'docker://gcr.io/androidbuild-re-dockerimage/android-build-remoteexec-image@sha256:582efb38f0c229ea39952fff9e132ccbe183e14869b39888010dacf56b360d62' },
                  ],
                },
                workerId: { datacenter: 'github', rack: 'out', slot: '${{ github.run_id }}', hostname: 'out-${{ github.run_id }}' },
              }],
            }],
            inputDownloadConcurrency: 10,
            outputUploadConcurrency: 11,
            directoryCache: { maximumCount: 1000, maximumSizeBytes: 1000 * 1024, cacheReplacementPolicy: 'LEAST_RECENTLY_USED' },
          }
          EOF

          cat > "$BB_CONFIG/runner.jsonnet" <<EOF
          local common = import 'common.libsonnet';
          {
            buildDirectoryPath: '/worker/build',
            global: common.global,
            grpcServers: [{ listenPaths: ['/worker/runner'], authenticationPolicy: { allow: {} }, }],
          }
          EOF

          docker run --rm \
            --network host \
            -v "$BB_RUNNER:/bb" \
            "$BB_RUNNER_INSTALLER"

          docker rm -f bb-runner bb-worker 2>/dev/null || true

          docker run -d --name bb-runner \
            --network none \
            -v "$BB_RUNNER:/bb" \
            -v "$BB_CONFIG:/config:ro" \
            -v "$BB_WORKER:/worker" \
            "$RBE_CONTAINER_IMAGE" \
            sh -c 'while ! test -f /bb/installed; do sleep 1; done; exec /bb/bb_runner /config/runner.jsonnet'

          docker run -d --name bb-worker \
            --network host \
            -v "$BB_CONFIG:/config:ro" \
            -v "$BB_WORKER:/worker" \
            "$BB_WORKER_IMAGE" /config/worker.jsonnet

          for i in {1..60}; do
            if docker logs bb-worker 2>&1 | grep -q "Synchronize"; then
              break
            fi
            sleep 1
          done

          echo "OUT RBE worker configured against $RBE_STORAGE_IP:8983"

          echo "=== NBD server status ==="
          pgrep -a nbd-server || true

          echo "=== NBD listening sockets ==="
          sudo ss -lntp | grep -E '10809|nbd-server' || true

          TS_IP=$(tailscale ip -4)

          if [[ -z "$TS_IP" ]]; then
            echo "ERROR: Could not determine Tailscale IPv4."
            exit 1
          fi

          echo
          echo "OUT runner Tailscale IP:"
          echo "$TS_IP"
          echo

          PARENT_TS_IP="${{ inputs.parent_tailscale_ip }}"

          if [[ -z "$PARENT_TS_IP" ]]; then
            echo "ERROR: parent_tailscale_ip is empty."
            exit 1
          fi

          echo "Parent Tailscale IP: $PARENT_TS_IP"

          echo "Testing Tailscale connectivity..."

          if ! tailscale ping \
            --timeout=10s \
            "$PARENT_TS_IP"; then

            echo "ERROR: Cannot reach parent runner over Tailscale."
            tailscale status || true
            exit 1
          fi

          echo "Tailscale connection OK."


          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            runner@"$PARENT_TS_IP" \
            "echo '$TS_IP' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/out_runner_ip"

          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            runner@"$PARENT_TS_IP" \
            "echo '${{ github.run_id }}' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/out_runner_run_id"

          echo "OUT runner IP registered with parent."

          echo
          echo "=========================================="
          echo "OUT RUNNER READY"
          echo "=========================================="
          echo "Tailscale IP: $TS_IP"
          echo "NBD port: 10809"
          echo "NBD export: android-out"
          echo "Image: $OUT_IMG"
          echo "=========================================="

          echo "=========================================="
          echo "OUT RUNNER SUPERVISOR STARTED"
          echo "=========================================="

          while true; do
            PARENT_STATUS=$(
              gh run view \
                "${{ inputs.parent_run_id }}" \
                --repo "${{ github.repository }}" \
                --json status \
                --jq '.status' \
                2>/dev/null
            )

            echo "Parent workflow status: ${PARENT_STATUS:-unknown}"

            case "$PARENT_STATUS" in
              completed|cancelled|failure|timed_out)
                echo "Parent workflow is no longer active."
                echo "Stopping OUT runner."

                sudo sync || true
                sudo pkill nbd-server || true

                exit 0
                ;;
            esac

            sleep 60
          done

      - name: Connect to initial OUT storage
        if: inputs.role == 'main'
        shell: bash
        run: |
          set -e

          IP_FILE="$GITHUB_WORKSPACE/out_runner_ip"
          RUN_ID_FILE="$GITHUB_WORKSPACE/out_runner_run_id"

          echo "=========================================="
          echo "WAITING FOR INITIAL OUT RUNNER"
          echo "=========================================="

          for i in {1..120}; do
            if [[ -s "$IP_FILE" && -s "$RUN_ID_FILE" ]]; then
              break
            fi

            echo "Waiting for OUT runner... ($i/120)"
            sleep 5
          done

          if [[ ! -s "$IP_FILE" ]]; then
            echo "ERROR: OUT runner IP was not received."
            exit 1
          fi

          if [[ ! -s "$RUN_ID_FILE" ]]; then
            echo "ERROR: OUT runner workflow ID was not received."
            exit 1
          fi

          OUT_IP=$(cat "$IP_FILE")
          OUT_RUN_ID=$(cat "$RUN_ID_FILE")

          echo "OUT runner IP: $OUT_IP"
          echo "OUT workflow ID: $OUT_RUN_ID"

          sudo modprobe nbd max_part=8
          sudo mkdir -p /storage/android-out/out

          sudo nbd-client \
            "$OUT_IP" \
            10809 \
            /dev/nbd0 \
            -N android-out

          sudo mount \
            /dev/nbd0 \
            /storage/android-out/out

          echo "=========================================="
          echo "OUT STORAGE CONNECTED"
          echo "=========================================="

          df -h /storage/android-out/out

          echo "Fixing permissions..."
          sudo chown runner:runner /storage/android-out/out
          ls -l /storage/android-out/out

      - name: Builder - Register workflow ID
        if: inputs.role == 'builder' && inputs.handoff_id != ''
        shell: bash
        run: |
          set -e

          PARENT_TS_IP="${{ inputs.parent_tailscale_ip }}"
          TS_IP="$(tailscale ip -4)"

          echo "=========================================="
          echo "REGISTERING BUILDER OVER TAILSCALE"
          echo "=========================================="

          if [[ -z "$PARENT_TS_IP" ]]; then
            echo "ERROR: parent_tailscale_ip is empty."
            exit 1
          fi

          if [[ -z "$TS_IP" ]]; then
            echo "ERROR: Could not determine Builder Tailscale IP."
            exit 1
          fi

          echo "Parent Tailscale IP: $PARENT_TS_IP"
          echo "Builder Tailscale IP: $TS_IP"

          echo "Testing Tailscale connectivity..."

          if ! tailscale ping \
            --timeout=10s \
            "$PARENT_TS_IP"; then
            echo "ERROR: Cannot reach parent runner over Tailscale."
            tailscale status || true
            exit 1
          fi

          echo "Testing SSH..."

          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            runner@"$PARENT_TS_IP" \
            "echo 'SSH over Tailscale works.'"

          echo "Registering builder workflow ID and Tailscale IP..."

          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            runner@"$PARENT_TS_IP" \
            "printf '%s\n' '${{ github.run_id }}' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/builder_${{ inputs.handoff_id }} && printf '%s\n' '$TS_IP' > /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/builder_${{ inputs.handoff_id }}_ip"

          echo "Registered builder run ID: ${{ github.run_id }}"
          echo "Registered builder Tailscale IP: $TS_IP"

          echo "=========================================="
          echo "BUILDER REGISTRATION COMPLETE"
          echo "=========================================="

      - name: Builder - Start handoff timer
        if: inputs.role == 'builder'
        shell: bash
        run: |
          # This timestamp is intentionally before the transfer.
          # The transfer time therefore counts against handoff_seconds.
          date +%s > "$GITHUB_WORKSPACE/builder_handoff_start"

          echo "Builder handoff timer started:"
          cat "$GITHUB_WORKSPACE/builder_handoff_start"

      - name: Builder - Download workspace
        if: inputs.role == 'builder'
        shell: bash
        env:
          SSHPASS: ${{ secrets.userpassword }}
        run: |
          set -e

          echo "=========================================="
          echo "BUILDER RUNNER"
          echo "=========================================="

          PARENT_TS_IP="${{ inputs.parent_tailscale_ip }}"

          echo "Parent run: ${{ inputs.parent_run_id }}"
          echo "Parent Tailscale IP: $PARENT_TS_IP"
          echo "Builder Tailscale IP: $(tailscale ip -4)"
          echo

          if [[ -z "$PARENT_TS_IP" ]]; then
            echo "ERROR: parent_tailscale_ip is empty."
            exit 1
          fi

          # ==========================================================
          # TEST TAILSCALE
          # ==========================================================

          echo "=========================================="
          echo "TESTING TAILSCALE CONNECTION"
          echo "=========================================="

          if ! tailscale ping \
            --timeout=10s \
            "$PARENT_TS_IP"; then

            echo "ERROR: Cannot reach parent runner over Tailscale."
            tailscale status || true
            exit 1
          fi

          echo "Tailscale connection OK."

          # ==========================================================
          # TEST SSH
          # ==========================================================

          echo "=========================================="
          echo "TESTING SSH CONNECTION"
          echo "=========================================="

          sshpass -e ssh \
            -p 22 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=30 \
            runner@"$PARENT_TS_IP" \
            "echo 'SSH over Tailscale works.'"

          # ==========================================================
          # DOWNLOAD ROM IMAGE
          # ==========================================================

          echo "=========================================="
          echo "DOWNLOADING ROM IMAGE"
          echo "=========================================="

          sudo mkdir -p /storage/android-rom

          sudo chown runner:runner /storage/android-rom

          echo "=========================================="
          echo "DOWNLOADING ROM IMAGE VIA NBD"
          echo "=========================================="

          sudo modprobe nbd max_part=8

          sudo nbd-client \
            "$PARENT_TS_IP" \
            10809 \
            /dev/nbd2 \
            -N android-rom

          echo "Copying ROM image..."

          sudo truncate -s "${{ inputs.ROM_SIZE }}G" /storage/android-rom/rom.img
          
          sudo dd \
            if=/dev/nbd2 \
            of=/storage/android-rom/rom.img \
            bs=16M \
            status=progress \
            conv=sparse

          echo "Disconnecting ROM NBD..."

          sudo nbd-client \
            -d \
            /dev/nbd2

          echo "ROM image transfer complete."

          echo
          echo "ROM image:"
          ls -lh /storage/android-rom/rom.img

          echo
          echo "Actual allocated size:"
          sudo du -h /storage/android-rom/rom.img

          echo
          echo "Logical size:"
          sudo du --apparent-size -h /storage/android-rom/rom.img

          # ==========================================================
          # MOUNT ROM IMAGE
          # ==========================================================

          echo "=========================================="
          echo "MOUNTING ROM IMAGE"
          echo "=========================================="

          sudo mkdir -p /storage/android-rom/rom

          sudo mount \
            -o loop \
            /storage/android-rom/rom.img \
            /storage/android-rom/rom

          sudo chown runner:runner /storage/android-rom/rom

          echo
          echo "ROM filesystem:"
          df -h /storage/android-rom/rom

          echo
          echo "ROM mount:"
          mount | grep "/storage/android-rom/rom"

          echo "ROM image mounted successfully."

          # ==========================================================
          # WAIT FOR NEW OUT RUNNER
          # ==========================================================

          OLD_OUT_IP="${{ inputs.old_out_ip }}"

          echo "=========================================="
          echo "WAITING FOR NEW OUT RUNNER"
          echo "=========================================="

          echo "Old OUT IP: $OLD_OUT_IP"

          NEW_OUT_IP=""
          NEW_OUT_RUN_ID=""

          for i in {1..480}; do

            CURRENT_OUT_IP=$(
              cat "$GITHUB_WORKSPACE/out_runner_ip" 2>/dev/null || true
            )

            CURRENT_OUT_IP=$(echo "$CURRENT_OUT_IP" | tr -d '[:space:]')

            CURRENT_OUT_RUN_ID=$(
              cat "$GITHUB_WORKSPACE/out_runner_run_id" 2>/dev/null || true
            )

            CURRENT_OUT_RUN_ID=$(echo "$CURRENT_OUT_RUN_ID" | tr -d '[:space:]')

            if [[ -n "$CURRENT_OUT_IP" \
                && "$CURRENT_OUT_IP" != "$OLD_OUT_IP" \
                && -n "$CURRENT_OUT_RUN_ID" ]]; then

              NEW_OUT_IP="$CURRENT_OUT_IP"
              NEW_OUT_RUN_ID="$CURRENT_OUT_RUN_ID"

              break
            fi

            echo "New OUT runner not ready yet... ($i/480)"
            sleep 5
          done

          if [[ -z "$NEW_OUT_IP" ]]; then
            echo "ERROR: New OUT runner IP was not received."
            exit 1
          fi

          if [[ -z "$NEW_OUT_RUN_ID" ]]; then
            echo "ERROR: New OUT runner workflow ID was not received."
            exit 1
          fi

          echo "$NEW_OUT_IP" \
            > "$GITHUB_WORKSPACE/out_runner_ip"

          echo "$NEW_OUT_RUN_ID" \
            > "$GITHUB_WORKSPACE/out_runner_run_id"

          echo "New OUT runner IP: $NEW_OUT_IP"
          echo "New OUT workflow ID: $NEW_OUT_RUN_ID"

          echo "=========================================="
          echo "OUT RUNNER SWITCH COMPLETE"
          echo "=========================================="

          if [[ "${{ inputs.use_external_storage }}" == "true" ]]; then
            OLD_STORAGE_IP="${{ inputs.old_storage_ip }}"

            echo "=========================================="
            echo "WAITING FOR NEW STORAGE RUNNER"
            echo "=========================================="

            echo "Old STORAGE IP: ${OLD_STORAGE_IP:-none}"

            NEW_STORAGE_IP=""
            NEW_STORAGE_RUN_ID=""

            for i in {1..480}; do
              CURRENT_STORAGE_IP=$(
                cat "$GITHUB_WORKSPACE/storage_runner_ip" 2>/dev/null || true
              )

              CURRENT_STORAGE_IP=$(echo "$CURRENT_STORAGE_IP" | tr -d '[:space:]')

              CURRENT_STORAGE_RUN_ID=$(
                cat "$GITHUB_WORKSPACE/storage_runner_run_id" 2>/dev/null || true
              )

              CURRENT_STORAGE_RUN_ID=$(echo "$CURRENT_STORAGE_RUN_ID" | tr -d '[:space:]')

              if [[ -n "$CURRENT_STORAGE_IP" \
                  && "$CURRENT_STORAGE_IP" != "$OLD_STORAGE_IP" \
                  && -n "$CURRENT_STORAGE_RUN_ID" ]]; then

                NEW_STORAGE_IP="$CURRENT_STORAGE_IP"
                NEW_STORAGE_RUN_ID="$CURRENT_STORAGE_RUN_ID"

                break
              fi

              echo "New STORAGE runner not ready yet... ($i/480)"
              sleep 5
            done

            if [[ -z "$NEW_STORAGE_IP" ]]; then
              echo "ERROR: New STORAGE runner IP was not received."
              exit 1
            fi

            if [[ -z "$NEW_STORAGE_RUN_ID" ]]; then
              echo "ERROR: New STORAGE runner workflow ID was not received."
              exit 1
            fi

            echo "$NEW_STORAGE_IP" > "$GITHUB_WORKSPACE/storage_runner_ip"
            echo "$NEW_STORAGE_RUN_ID" > "$GITHUB_WORKSPACE/storage_runner_run_id"

            echo "New STORAGE runner IP: $NEW_STORAGE_IP"
            echo "New STORAGE workflow ID: $NEW_STORAGE_RUN_ID"

            echo "=========================================="
            echo "STORAGE RUNNER SWITCH COMPLETE"
            echo "=========================================="
          fi

          # ==========================================================
          # STOP PARENT
          # ==========================================================

          echo "=========================================="
          echo "STOPPING PARENT WORKFLOW"
          echo "=========================================="

          gh run cancel \
            "${{ inputs.parent_run_id }}" \
            --repo "${{ github.repository }}"

          echo "Parent cancellation requested."

          # ==========================================================
          # CALCULATE REMAINING HANDOFF TIME
          # ==========================================================

          START_TIME=$(cat "$GITHUB_WORKSPACE/builder_handoff_start")
          NOW=$(date +%s)

          ELAPSED=$((NOW - START_TIME))
          REMAINING=$(( ${{ inputs.handoff_seconds }} - ELAPSED ))

          if [[ "$REMAINING" -lt 0 ]]; then
            REMAINING=0
          fi

          if [[ "$REMAINING" -le 0 ]]; then
            echo "ERROR: Builder used all handoff time before the build could start."
            exit 1
          fi

          echo "Configured handoff time: ${{ inputs.handoff_seconds }} seconds"
          echo "Time spent transferring/switching: ${ELAPSED} seconds"
          echo "Remaining builder time: ${REMAINING} seconds"

          echo "$REMAINING" \
            > "$GITHUB_WORKSPACE/remaining_handoff_seconds"

          # ==========================================================
          # FINAL STATUS
          # ==========================================================

          echo "=========================================="
          echo "BUILDER WORKSPACE READY"
          echo "=========================================="

          echo
          echo "ROM source:"
          ls -la /storage/android-rom/rom/

          echo
          echo "ROM filesystem:"
          df -h /storage/android-rom/rom

      - name: Setup ROM NBD server
        if: inputs.role == 'main' || inputs.role == 'builder'
        shell: bash
        run: |
          set -e

          ROM_IMG="/storage/android-rom/rom.img"

          sudo modprobe nbd max_part=8


          sudo tee /etc/nbd-server/config >/dev/null <<EOF
          [generic]
              user = runner
              group = runner
              listenaddr = 0.0.0.0

          [android-rom]
              exportname = $ROM_IMG
              flush = true
              trim = true
          EOF

          sudo pkill nbd-server 2>/dev/null || true

          sudo nbd-server \
            -C /etc/nbd-server/config

          sleep 3

          echo "=== ROM NBD server ==="

          sudo ss -lntp | grep 10809 || true

          echo "ROM export ready"

      - name: Builder - Connect to STORAGE
        if: inputs.role == 'builder' && inputs.use_external_storage
        shell: bash
        run: |
          set -e

          IP_FILE="$GITHUB_WORKSPACE/storage_runner_ip"
          RUN_ID_FILE="$GITHUB_WORKSPACE/storage_runner_run_id"
          OLD_STORAGE_IP="${{ inputs.old_storage_ip }}"

          echo "=========================================="
          echo "WAITING FOR STORAGE RUNNER"
          echo "=========================================="

          echo "Old STORAGE IP: ${OLD_STORAGE_IP:-none}"

          STORAGE_IP=""
          STORAGE_RUN_ID=""

          for i in {1..720}; do
            CURRENT_STORAGE_IP=$(cat "$IP_FILE" 2>/dev/null || true)
            CURRENT_STORAGE_IP=$(echo "$CURRENT_STORAGE_IP" | tr -d '[:space:]')

            CURRENT_STORAGE_RUN_ID=$(cat "$RUN_ID_FILE" 2>/dev/null || true)
            CURRENT_STORAGE_RUN_ID=$(echo "$CURRENT_STORAGE_RUN_ID" | tr -d '[:space:]')

            if [[ -n "$CURRENT_STORAGE_IP" \
                && "$CURRENT_STORAGE_IP" != "$OLD_STORAGE_IP" \
                && -n "$CURRENT_STORAGE_RUN_ID" ]]; then
              STORAGE_IP="$CURRENT_STORAGE_IP"
              STORAGE_RUN_ID="$CURRENT_STORAGE_RUN_ID"
              break
            fi

            echo "New STORAGE runner not ready yet... ($i/720)"
            sleep 5
          done

          if [[ -z "$STORAGE_IP" ]]; then
            echo "ERROR: New STORAGE runner IP was not received."
            exit 1
          fi

          if [[ -z "$STORAGE_RUN_ID" ]]; then
            echo "ERROR: New STORAGE runner workflow ID was not received."
            exit 1
          fi

          echo "$STORAGE_IP" > "$IP_FILE"
          echo "$STORAGE_RUN_ID" > "$RUN_ID_FILE"

          echo "STORAGE runner IP: $STORAGE_IP"
          echo "STORAGE workflow ID: $STORAGE_RUN_ID"

          sudo modprobe nbd max_part=8
          sudo mkdir -p /storage/android-rom/rom/prebuilts

          CONNECTED=false
          for i in {1..120}; do
            if sudo nbd-client \
              "$STORAGE_IP" \
              10809 \
              /dev/nbd3 \
              -N android-storage; then
              CONNECTED=true
              break
            fi

            echo "STORAGE NBD server not ready yet... ($i/120)"
            sudo nbd-client -d /dev/nbd3 2>/dev/null || true
            sleep 5
          done

          if [[ "$CONNECTED" != "true" ]]; then
            echo "ERROR: Could not connect to STORAGE NBD server."
            exit 1
          fi

          sudo mount \
            /dev/nbd3 \
            /storage/android-rom/rom/prebuilts

          echo "=========================================="
          echo "STORAGE CONNECTED"
          echo "=========================================="

          df -h /storage/android-rom/rom/prebuilts

      - name: Builder - Connect to OUT storage
        if: inputs.role == 'builder'
        shell: bash
        run: |
          set -e

          OUT_IP=$(cat "$GITHUB_WORKSPACE/out_runner_ip")

          sudo modprobe nbd max_part=8
          sudo mkdir -p /storage/android-out/out

          sudo nbd-client \
            "$OUT_IP" \
            10809 \
            /dev/nbd0 \
            -N android-out

          sudo mount \
            /dev/nbd0 \
            /storage/android-out/out

          echo "=========================================="
          echo "OUT STORAGE CONNECTED"
          echo "=========================================="

          df -h /storage/android-out/out

      - name: Build ROM
        if: inputs.role == 'main' || inputs.role == 'builder'
        shell: bash
        env:
          CUSTOM_ENV: ${{ inputs.custom_env }}
          CUSTOM_COMMANDS: ${{ inputs.custom_commands }}
          BUILD_COMMAND_INPUT: ${{ inputs.build_command }}
        run: |
          cd /storage/android-rom/rom

          cat << 'EOF' > run_build.sh
          #!/bin/bash

          attempt=1
          max_attempts=2

          while [ $attempt -le $max_attempts ]; do
            echo "=== BUILD ATTEMPT $attempt of $max_attempts ==="

            (
              if [[ "${{ github.actor }}" == "TheGamerKing561" && "${{ inputs.set_custom_build_identity }}" == "true" ]]; then
                export BUILD_USERNAME="thegamerking"
                export BUILD_HOSTNAME="github-runner"
                export KBUILD_BUILD_USER="thegamerking"
                export KBUILD_BUILD_HOST="github-runner"
                echo "Using custom build identity."
              fi

              if [ -n "$CUSTOM_ENV" ]; then
                echo "Applying custom environment variables: $CUSTOM_ENV"
                export $CUSTOM_ENV
              fi

              # Android/Soong RBE client configuration. The BuildBarn frontend is
              # on the current STORAGE runner. Soong starts reproxy locally and
              # reproxy sends REAPI actions to RBE_service.
              RBE_STORAGE_IP=$(cat "$GITHUB_WORKSPACE/storage_runner_ip" 2>/dev/null | tr -d '[:space:]')
              if [[ -z "$RBE_STORAGE_IP" ]]; then
                echo "ERROR: storage_runner_ip is missing; cannot start RBE."
                exit 1
              fi

              export USE_RBE=1
              export RBE_service="$RBE_STORAGE_IP:8980"
              export RBE_instance=""
              export RBE_DIR="prebuilts/remoteexecution-client/live"
              export RBE_CXX_EXEC_STRATEGY="remote_local_fallback"
              export RBE_JAVAC_EXEC_STRATEGY="remote_local_fallback"
              export RBE_R8_EXEC_STRATEGY="remote_local_fallback"
              export RBE_D8_EXEC_STRATEGY="remote_local_fallback"
              export RBE_JAVAC=1
              export RBE_R8=1
              export RBE_D8=1
              export NINJA_REMOTE_NUM_JOBS=16
              export RBE_log_dir=/tmp/rbe
              export RBE_output_dir=/tmp/rbe
              export RBE_proxy_log_dir=/tmp/rbe
              export RBE_download_tmp_dir=/tmp/rbe
              mkdir -p /tmp/rbe

              echo "RBE service: $RBE_service"
              echo "RBE strategies: remote_local_fallback"
              echo "NINJA_REMOTE_NUM_JOBS: $NINJA_REMOTE_NUM_JOBS"

              if [ -n "$CUSTOM_COMMANDS" ]; then
                echo "=== RUNNING CUSTOM COMMANDS ==="
                eval "$CUSTOM_COMMANDS"
                echo "==============================="
              fi

              cd /storage/android-rom/rom

              rm -rf /storage/android-rom/rom/out 
              ln -s /storage/android-out/out /storage/android-rom/rom/out
              
              export DEVICE='${{ inputs.device }}'
              export BUILD_TYPE='${{ inputs.build_type }}'
              export BUILD_COMMAND="$BUILD_COMMAND_INPUT"

              echo "=== STARTING ROM BUILD ==="

              echo "=== RUNNING BUILD COMMAND ==="
              echo "Build command: $BUILD_COMMAND"
              echo "====================================="
              
              eval "$BUILD_COMMAND"

            )

            exit_code=$?

            if [ $exit_code -eq 0 ]; then
              echo "Build succeeded on attempt $attempt!"
              exit 0
            fi

            echo "Build failed on attempt $attempt with exit code $exit_code."

            if [ $attempt -lt $max_attempts ]; then
              echo "Waiting 10 minutes before retrying..."
              sleep 600
            fi

            attempt=$((attempt + 1))
          done

          echo "Build failed after $max_attempts attempts."
          exit 1
          EOF

          chmod +x run_build.sh

          # ==========================================================
          # HANDOFF WATCHDOG
          # ==========================================================

          if [[ "${{ inputs.role }}" == "main" ]]; then
            HANDOFF_SECONDS="${{ inputs.handoff_seconds }}"

          else
            HANDOFF_SECONDS=$(cat "$GITHUB_WORKSPACE/remaining_handoff_seconds")

          fi

          echo "=========================================="
          echo "STARTING HANDOFF WATCHDOG"
          echo "=========================================="
          echo "Role: ${{ inputs.role }}"
          echo "Handoff timeout: ${HANDOFF_SECONDS} seconds"
          echo "=========================================="

          (
            sleep "$HANDOFF_SECONDS"

            echo "=========================================="
            echo "HANDOFF TIME REACHED"
            echo "=========================================="

            touch "$GITHUB_WORKSPACE/handoff_requested"

            if screen -list | grep -q "android-build"; then
              echo "Stopping android-build screen session..."
              screen -S android-build -X quit || true
            fi

            pkill -TERM \
              -f "/storage/android-rom/rom/run_build.sh" \
              || true

            sleep 15

            pkill -KILL \
              -f "/storage/android-rom/rom/run_build.sh" \
              || true

            echo "Build process termination completed."

            pkill -TERM -x reproxy 2>/dev/null || true
            sleep 5
            pkill -KILL -x reproxy 2>/dev/null || true

            sudo sync || true

            echo "Unmounting ROM image..."
            
            sudo umount \
              /storage/android-rom/rom \
              || true
            
            echo "Unmounting OUT storage..."
            
            sudo umount \
              /storage/android-out/out \
              || true
            
            sudo nbd-client \
              -d /dev/nbd0 \
              || true

            if [[ "${{ inputs.use_external_storage }}" == "true" ]]; then
              echo "Unmounting STORAGE..."

              sudo umount \
                /storage/android-rom/rom/prebuilts \
                || true

              sudo nbd-client \
                -d /dev/nbd3 \
                || true

              rm -rf /storage/android-rom/rom/prebuilts
            fi

            OLD_OUT_IP_FILE="$GITHUB_WORKSPACE/out_runner_ip"

            if [[ ! -s "$OLD_OUT_IP_FILE" ]]; then
              echo "ERROR: Current OUT runner IP file missing."
              exit 1
            fi

            OLD_OUT_IP=$(cat "$OLD_OUT_IP_FILE")

            OLD_STORAGE_IP=""
            if [[ "${{ inputs.use_external_storage }}" == "true" ]]; then
              OLD_STORAGE_IP_FILE="$GITHUB_WORKSPACE/storage_runner_ip"

              if [[ ! -s "$OLD_STORAGE_IP_FILE" ]]; then
                echo "ERROR: Current STORAGE runner IP file missing."
                exit 1
              fi

              OLD_STORAGE_IP=$(cat "$OLD_STORAGE_IP_FILE" | tr -d '[:space:]')

              if [[ -z "$OLD_STORAGE_IP" ]]; then
                echo "ERROR: Current STORAGE runner IP is empty."
                exit 1
              fi

              echo "Current STORAGE runner IP: $OLD_STORAGE_IP"
            fi

            PARENT_TS_IP="${{ steps.tailscale_ip.outputs.ip }}"

            if [[ -z "$PARENT_TS_IP" ]]; then
              echo "ERROR: Parent Tailscale IP is empty."
              exit 1
            fi

            echo "Parent Tailscale IP: $PARENT_TS_IP"


            echo "=========================================="
            echo "DISPATCHING NEW BUILDER"
            echo "=========================================="

            HANDOFF_ID="${{ github.run_id }}-builder-$(date +%s)-$RANDOM"

            echo "Handoff ID: $HANDOFF_ID"
            
            gh workflow run "${{ github.workflow }}" \
              --repo "${{ github.repository }}" \
              --ref "${{ github.ref_name }}" \
              -f rom_manifest="${{ inputs.rom_manifest }}" \
              -f rom_manifest_branch="${{ inputs.rom_manifest_branch }}" \
              -f device="${{ inputs.device }}" \
              -f build_type="${{ inputs.build_type }}" \
              -f manifest_url="${{ inputs.manifest_url }}" \
              -f upload_repository="${{ inputs.upload_repository }}" \
              -f zip_pattern="${{ inputs.zip_pattern }}" \
              -f custom_env="${{ inputs.custom_env }}" \
              -f custom_commands="${{ inputs.custom_commands }}" \
              -f set_custom_build_identity="${{ inputs.set_custom_build_identity }}" \
              -f SWAP_SIZE="${{ inputs.SWAP_SIZE }}" \
              -f handoff_seconds="${{ inputs.handoff_seconds }}" \
              -f role=builder \
              -f parent_run_id="${{ github.run_id }}" \
              -f parent_tailscale_ip="${{ steps.tailscale_ip.outputs.ip }}" \
              -f old_out_ip="$OLD_OUT_IP" \
              -f old_storage_ip="$OLD_STORAGE_IP" \
              -f use_external_storage="${{ inputs.use_external_storage }}" \
              -f handoff_id="$HANDOFF_ID"

            echo "Waiting for builder to register..."

            BUILDER_RUN_ID=""

            for i in {1..300}; do
              BUILDER_RUN_ID=$(
               cat "$GITHUB_WORKSPACE/builder_${HANDOFF_ID}" 2>/dev/null || true
             )

              BUILDER_RUN_ID=$(echo "$BUILDER_RUN_ID" | tr -d '[:space:]')

              if [[ -n "$BUILDER_RUN_ID" ]]; then
                break
              fi

              echo "Waiting for builder to register... ($i/300)"
              sleep 2
            done

            if [[ -z "$BUILDER_RUN_ID" ]]; then
              echo "ERROR: Builder workflow ID was not received."
              exit 1
            fi

            echo "Builder workflow ID: $BUILDER_RUN_ID"

            echo "Waiting for Builder Tailscale IP..."

            BUILDER_TS_IP=""

            for i in {1..300}; do
              BUILDER_TS_IP=$(
               cat "$GITHUB_WORKSPACE/builder_${HANDOFF_ID}_ip" 2>/dev/null || true
              )

              BUILDER_TS_IP=$(echo "$BUILDER_TS_IP" | tr -d '[:space:]')

              if [[ -n "$BUILDER_TS_IP" ]]; then
                break
              fi

              echo "Waiting for Builder Tailscale IP... ($i/300)"
              sleep 2
            done

            if [[ -z "$BUILDER_TS_IP" ]]; then
              echo "ERROR: Builder Tailscale IP was not received."
              exit 1
            fi

            echo "Builder Tailscale IP: $BUILDER_TS_IP"


            echo "=========================================="
            echo "DISPATCHING NEW OUT"
            echo "=========================================="

            gh workflow run "${{ github.workflow }}" \
              --repo "${{ github.repository }}" \
              --ref "${{ github.ref_name }}" \
              -f rom_manifest="${{ inputs.rom_manifest }}" \
              -f rom_manifest_branch="${{ inputs.rom_manifest_branch }}" \
              -f device="${{ inputs.device }}" \
              -f build_type="${{ inputs.build_type }}" \
              -f manifest_url="${{ inputs.manifest_url }}" \
              -f upload_repository="${{ inputs.upload_repository }}" \
              -f zip_pattern="${{ inputs.zip_pattern }}" \
              -f custom_env="${{ inputs.custom_env }}" \
              -f custom_commands="${{ inputs.custom_commands }}" \
              -f set_custom_build_identity="${{ inputs.set_custom_build_identity }}" \
              -f SWAP_SIZE="8" \
              -f handoff_seconds="${{ inputs.handoff_seconds }}" \
              -f role=out \
              -f parent_run_id="$BUILDER_RUN_ID" \
              -f parent_tailscale_ip="$BUILDER_TS_IP" \
              -f old_out_ip="$OLD_OUT_IP" \
              -f use_external_storage="${{ inputs.use_external_storage }}"

            echo "=========================================="
            echo "NEW BUILDER + OUT DISPATCHED"
            echo "=========================================="

            if [[ "${{ inputs.use_external_storage }}" == "true" ]]; then
              echo "=========================================="
              echo "DISPATCHING NEW STORAGE"
              echo "=========================================="

              gh workflow run "${{ github.workflow }}" \
                --repo "${{ github.repository }}" \
                --ref "${{ github.ref_name }}" \
                -f rom_manifest="${{ inputs.rom_manifest }}" \
                -f rom_manifest_branch="${{ inputs.rom_manifest_branch }}" \
                -f device="${{ inputs.device }}" \
                -f build_type="${{ inputs.build_type }}" \
                -f manifest_url="${{ inputs.manifest_url }}" \
                -f upload_repository="${{ inputs.upload_repository }}" \
                -f zip_pattern="${{ inputs.zip_pattern }}" \
                -f custom_env="${{ inputs.custom_env }}" \
                -f custom_commands="${{ inputs.custom_commands }}" \
                -f set_custom_build_identity="${{ inputs.set_custom_build_identity }}" \
                -f SWAP_SIZE="8" \
                -f ROM_SIZE="${{ inputs.ROM_SIZE }}" \
                -f handoff_seconds="${{ inputs.handoff_seconds }}" \
                -f use_external_storage="${{ inputs.use_external_storage }}" \
                -f role=storage \
                -f parent_run_id="$BUILDER_RUN_ID" \
                -f parent_tailscale_ip="$BUILDER_TS_IP" \
                -f old_storage_ip="$OLD_STORAGE_IP"

              echo "New STORAGE runner dispatched."
            fi

            while true; do
              sleep 30
            done

          ) &

          WATCHDOG_PID=$!

          echo "$WATCHDOG_PID" \
            > "$GITHUB_WORKSPACE/handoff_watchdog.pid"

          echo "Handoff watchdog started with PID $WATCHDOG_PID."

          # ==========================================================
          # COMMON BUILD EXECUTION
          # ==========================================================

          rm -f build.log build.exit

          screen -dmS android-build \
            bash -c './run_build.sh 2>&1 | tee build.log; echo ${PIPESTATUS[0]} > build.exit'

          echo "Build started in screen session. Streaming logs..."

          while [[ ! -f build.log ]]; do
            sleep 1
          done

          tail -f build.log &
          TAIL_PID=$!

          while screen -list | grep -q "android-build"; do
            sleep 10
          done

          kill "$TAIL_PID" 2>/dev/null || true

          if [[ ! -f build.exit ]]; then
            if [[ -f "$GITHUB_WORKSPACE/handoff_requested" ]]; then
              echo "=========================================="
              echo "BUILD STOPPED FOR HANDOFF"
              echo "=========================================="

              while true; do
                sleep 30
              done
            fi

            echo "Build exit status file not found."
            exit 1
          fi

          STATUS=$(cat build.exit)

          if [[ "$STATUS" != "0" ]]; then
            echo "=== FINAL BUILD ERROR LOGS (Last 100 lines) ==="
            tail -n 100 build.log
            echo "==============================================="
            exit "$STATUS"
          fi

          echo "=========================================="
          echo "Build completed successfully!"
          echo "=========================================="

          df -h

      - name: Prepare release assets
        id: prepare
        if: inputs.role == 'main' || inputs.role == 'builder'
        shell: bash
        run: |
          cd /storage/android-out/out

          OUT="target/product/${{ inputs.device }}"

          if [[ ! -d "$OUT" ]]; then
            echo "Output directory not found: $OUT"
            exit 1
          fi

          cd "$OUT"

          BUILD_PROP="system/build.prop"

          ZIP=$(find . \
            -maxdepth 1 \
            -type f \
            -name "${{ inputs.zip_pattern }}" \
            | head -n1)

          if [[ -z "$ZIP" ]]; then
            echo "No ROM ZIP found."
            exit 1
          fi

          BUILD_DATE=$(date +%Y-%m-%d)
          TITLE_DATE=$(date +%Y%m%d)

          BUILD_NUMBER=$(sed \
            -n 's/^ro\.system\.build\.version\.incremental=//p' \
            "$BUILD_PROP")

          PATCH_LEVEL=$(sed \
            -n 's/^ro\.build\.version\.security_patch=//p' \
            "$BUILD_PROP")

          FILES=("$ZIP")

          {
            echo "📅 Build date: $BUILD_DATE"
            echo
            echo "🔒 Security patch level: $PATCH_LEVEL"
            echo
            echo "## SHA256 sums"
            echo

            echo "\`$(sha256sum "$ZIP")\`"

            for img in \
              boot.img \
              recovery.img \
              vbmeta.img \
              dtbo.img \
              vendor_boot.img \
              init_boot.img \
              super_empty.img; do

              if [[ -f "$img" ]]; then
                FILES+=("$img")
                echo "\`$(sha256sum "$img")\`"
              fi
            done

          } > release_notes.md

          printf "%s\n" "${FILES[@]}" > files.txt

          echo "out_dir=$PWD" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "title_date=$TITLE_DATE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: inputs.role == 'main' || inputs.role == 'builder'
        shell: bash
        run: |
          cd "${{ steps.prepare.outputs.out_dir }}"

          mapfile -t FILES < files.txt

          gh release create \
            "${{ inputs.device }}-${{ steps.prepare.outputs.build_number }}" \
            "${FILES[@]}" \
            -R "${{ inputs.upload_repository }}" \
            --title "${{ inputs.rom_manifest_branch }} for ${{ inputs.device }} (${{ steps.prepare.outputs.title_date }})" \
            --notes-file release_notes.md

      - name: Stop OUT runner
        if: always() && (inputs.role == 'main' || inputs.role == 'builder')
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "STOPPING OUT RUNNER"
          echo "=========================================="

          RUN_ID_FILE="$GITHUB_WORKSPACE/out_runner_run_id"

          if [[ ! -s "$RUN_ID_FILE" ]]; then
            echo "OUT runner workflow ID not found."
            echo "Nothing to cancel."
            exit 0
          fi

          OUT_RUN_ID=$(cat "$RUN_ID_FILE")

          echo "OUT workflow ID: $OUT_RUN_ID"

          gh run cancel \
            "$OUT_RUN_ID" \
            --repo "${{ github.repository }}"

          echo "OUT runner cancellation requested."
      - name: Stop STORAGE runner
        if: always() && (inputs.role == 'main' || inputs.role == 'builder') && inputs.use_external_storage
        shell: bash
        run: |
          set +e

          echo "=========================================="
          echo "STOPPING STORAGE RUNNER"
          echo "=========================================="

          RUN_ID_FILE="$GITHUB_WORKSPACE/storage_runner_run_id"

          if [[ ! -s "$RUN_ID_FILE" ]]; then
            echo "STORAGE runner workflow ID not found."
            echo "Nothing to cancel."
            exit 0
          fi

          STORAGE_RUN_ID=$(cat "$RUN_ID_FILE")

          echo "STORAGE workflow ID: $STORAGE_RUN_ID"

          gh run cancel \
            "$STORAGE_RUN_ID" \
            --repo "${{ github.repository }}"

          echo "STORAGE runner cancellation requested."
